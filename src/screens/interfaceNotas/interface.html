<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançamento de Notas</title>
    <link rel="stylesheet" href="interface.css">
</head>
<body>

    <div class="container">
        <h1>Apontar Notas dos Alunos</h1>

        
        
        <table class="tabela-notas">
            <thead>
                <tr>
                    <th>Aluno</th>
                    <th>Componente 1 (Nota)</th>
                    <th>Componente 2 (Nota)</th>
                    <th>Componente 3 (Nota)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td data-aluno-id="1">Ana Silva</td>
                    <td><input type="number" class="input-nota" min="0" max="10" step="0.5"></td>
                    <td><input type="number" class="input-nota" min="0" max="10" step="0.5"></td>
                    <td><input type="number" class="input-nota" min="0" max="10" step="0.5"></td>
                </tr>
                <tr>
                    <td data-aluno-id="2">Bruno Costa</td>
                    <td><input type="number" class="input-nota" min="0" max="10" step="0.5"></td>
                    <td><input type="number" class="input-nota" min="0" max="10" step="0.5"></td>
                    <td><input type="number" class="input-nota" min="0" max="10" step="0.5"></td>
                </tr>
                <tr>
                    <td data-aluno-id="3">Carla Dias</td>
                    <td><input type="number" class="input-nota" min="0" max="10" step="0.5"></td>
                    <td><input type="number" class="input-nota" min="0" max="10" step="0.5"></td>
                    <td><input type="number" class="input-nota" min="0" max="10" step="0.5"></td>
                </tr>
            </tbody>
        </table>

        <div class="botoes-container">
            <button id="btnAdicionar" class="btn-adicionar">Adicionar Aluno</button>
            <button id="btnSalvar" class="btn-salvar">Salvar Notas</button>
        </div>
        
    </div>

    <script src="interface.js"></script>
</body>
</html>
