<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Cadastro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/cadastro/cadastro.css">
</head>
<body>

    <div class="container">
        <form method="POST" action="/api/auth/cadastro">
            <h2>Cadastro</h2>

            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome aqui" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" name="telefone" placeholder="(11) 91234-5678" pattern="\(\d{2}\) \d{5}-\d{4}" required maxlength="15" inputmode="tel">
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>
                <div class="input-wrapper">
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required minlength="6">
                    <small class="hint">
                        Mín. 6 caracteres, com maiúscula, minúscula, número e símbolo.
                    </small>
                </div>
            </div>

            <div class="form-group">
                <label for="confirma-senha">Confirme sua Senha:</label>
                <input type="password" id="confirma-senha" name="confirma-senha" placeholder="Confirme sua senha" required minlength="6">
            </div>
            
            <div id="msg-confirmacao"></div>

            <div class="container-botoes">
                <button type="submit" class="btn-principal">Cadastrar</button>
                <a href="/login" class="link-voltar">Voltar</a>
            </div>

        </form>
    </div>

    <script src="/cadastro/cadastro.js"></script>

</body>
</html>
