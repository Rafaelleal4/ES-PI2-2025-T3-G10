<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Instituições - Sistema de Notas</title>
    <link rel="stylesheet" href="/instituicoes/instituicoes.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gerenciar Instituições</h1>
            <div>
                <button id="btnDashboard" class="btn-secondary">Dashboard</button>
                <button id="btnSair" class="btn-secondary">Sair</button>
            </div>
        </header>

        <div class="acoes">
            <button id="btnNovaInstituicao" class="btn-primary">
                <span>+</span> Nova Instituição
            </button>
        </div>

        <div class="tabela-container">
            <table id="tabelaInstituicoes">
                <thead>
                    <tr>
                        <th>Nome da Instituição</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaInstituicoes">
                    <tr class="sem-dados">
                        <td colspan="2">Nenhuma instituição cadastrada</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal para criar/editar instituição -->
    <div id="modalInstituicao" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitulo">Nova Instituição</h2>
                <span class="close">&times;</span>
            </div>
            <form id="formInstituicao">
                <input type="hidden" id="instituicaoId">
                
                <div class="form-group">
                    <label for="inputNomeInstituicao">Nome da Instituição:</label>
                    <input type="text" id="inputNomeInstituicao" placeholder="Ex: PUC-Campinas" required>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="btnCancelar">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de confirmação de exclusão -->
    <div id="modalConfirmacao" class="modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Confirmar Exclusão</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <p>Tem certeza que deseja excluir a instituição <strong id="instituicaoNomeExcluir"></strong>?</p>
                <p class="aviso">Esta ação não poderá ser desfeita e removerá todos os cursos, disciplinas, turmas e notas associadas.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="btnCancelarExclusao">Cancelar</button>
                <button type="button" class="btn-danger" id="btnConfirmarExclusao">Excluir</button>
            </div>
        </div>
    </div>

    <script src="/instituicoes/instituicoes.js"></script>
</body>
</html>
